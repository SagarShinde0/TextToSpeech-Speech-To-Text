<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Assistant Pro</title>

<style>
:root {
  --primary: #2563eb;
  --success: #16a34a;
  --danger: #dc2626;
  --bg: #f1f5f9;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg);
  padding: 40px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

h2 { margin-bottom: 5px; }
small { color: #64748b; }

.section {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid #e5e7eb;
}

button {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  margin: 6px 4px;
}

.primary { background: var(--primary); color: white; }
.success { background: var(--success); color: white; }
.danger  { background: var(--danger); color: white; }

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

textarea, select, input[type=range] {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  font-size: 14px;
  border-radius: 6px;
  border: 1px solid #cbd5f5;
}

textarea { min-height: 90px; }

.status {
  margin-top: 8px;
  font-weight: 600;
  color: #475569;
}

.range-box {
  margin-top: 10px;
  text-align: left;
}
.range-box span {
  font-weight: 600;
}
</style>
</head>

<body>

<div class="container">
<h2>🎤 Voice Assistant Pro</h2>
<small>Professional Speech Recognition & Text-to-Speech System</small>

<!-- ===================== SPEECH TO TEXT ===================== -->
<div class="section">
<h3>Speech → Text</h3>

<button id="sttStart" class="success">Start Listening</button>
<button id="sttStop" class="danger" disabled>Stop</button>

<p class="status" id="sttStatus">Idle</p>

<textarea id="sttText" placeholder="Speak into your microphone..."></textarea>
</div>

<!-- ===================== TEXT TO SPEECH ===================== -->
<div class="section">
<h3>Text → Speech</h3>

<textarea id="ttsText" placeholder="Type text to speak..."></textarea>

<select id="voiceSelect"></select>

<div class="range-box">
  <label>
    Speed: <span id="speedValue">1.0x</span>
  </label>
  <input type="range" id="speedControl" min="0.5" max="2" step="0.1" value="1">
</div>

<button id="ttsPlay" class="primary">Speak</button>
<button id="ttsStop" class="danger">Stop</button>
</div>

<!-- ===================== MIC RECORDING ===================== -->
<div class="section">
<h3>Microphone Recording (Optional)</h3>
<small>Records microphone input only (not system TTS)</small><br>

<button id="recStart" class="success">Start Recording</button>
<button id="recStop" class="danger" disabled>Stop & Download</button>
</div>

</div>

<script>
"use strict";

/* ==========================================================
   SPEECH TO TEXT MODULE
========================================================== */

const STT = (() => {
  let recognition;
  let active = false;

  if (!("SpeechRecognition" in window || "webkitSpeechRecognition" in window)) {
    alert("Speech Recognition not supported. Use Google Chrome.");
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onstart = () => {
    active = true;
    sttStatus.innerText = "Listening...";
    toggle(true);
  };

  recognition.onresult = (e) => {
    let text = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        text += e.results[i][0].transcript + " ";
      }
    }
    sttText.value += text;
  };

  recognition.onerror = (e) => {
    sttStatus.innerText = "Error: " + e.error;
    stop();
  };

  recognition.onend = () => {
    if (active) recognition.start();
  };

  function start() {
    if (!active) recognition.start();
  }

  function stop() {
    active = false;
    recognition.stop();
    toggle(false);
    sttStatus.innerText = "Stopped";
  }

  function toggle(listening) {
    sttStart.disabled = listening;
    sttStop.disabled = !listening;
  }

  return { start, stop };
})();

sttStart.onclick = STT.start;
sttStop.onclick = STT.stop;

/* ==========================================================
   TEXT TO SPEECH MODULE (VOICE + SPEED CONTROL)
========================================================== */

let voices = [];
const speedSlider = document.getElementById("speedControl");
const speedValue = document.getElementById("speedValue");

function loadVoices() {
  voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = "";

  voices.forEach((voice, i) => {
    const opt = document.createElement("option");
    let label = voice.name.toLowerCase();

    if (label.includes("female") || label.includes("zira") || label.includes("woman"))
      opt.textContent = voice.name + " (Female)";
    else if (label.includes("male") || label.includes("david") || label.includes("man"))
      opt.textContent = voice.name + " (Male)";
    else
      opt.textContent = voice.name + " (Default)";

    opt.value = i;
    voiceSelect.appendChild(opt);
  });
}

speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

speedSlider.oninput = () => {
  speedValue.innerText = speedSlider.value + "x";
};

ttsPlay.onclick = () => {
  const text = ttsText.value.trim();
  if (!text) return alert("Enter text first.");

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  const voice = voices[voiceSelect.value];

  if (voice) {
    utter.voice = voice;
    utter.lang = voice.lang;
  }

  utter.rate = parseFloat(speedSlider.value); // 🔥 SPEED CONTROL
  utter.pitch = 1;

  speechSynthesis.speak(utter);
};

ttsStop.onclick = () => speechSynthesis.cancel();

/* ==========================================================
   MICROPHONE RECORDING MODULE
========================================================== */

let recorder, chunks = [], stream;

recStart.onclick = async () => {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream);
  chunks = [];

  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: "audio/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "mic-recording.webm";
    a.click();
    stream.getTracks().forEach(t => t.stop());
  };

  recorder.start();
  recStart.disabled = true;
  recStop.disabled = false;
};

recStop.onclick = () => {
  recorder.stop();
  recStart.disabled = false;
  recStop.disabled = true;
};
</script>

</body>
</html>
